name: CI

on:
  push:
  pull_request:

jobs:
  node:
    name: Node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/smoke-lsp.mjs
      - run: node scripts/smoke-lsp.mjs tests/fixtures/eslint-broken packages/runtime/dist/bundles/lsp.cjs
      - run: node scripts/smoke-mcp.mjs
      - run: node scripts/smoke-mcp.mjs tests/fixtures/eslint-broken packages/runtime/dist/bundles/mcp.cjs
      - run: npm run smoke:lifecycle
      - run: npm run smoke:pressure
      - run: npm run package:core && npm run package:runtime
      - run: npm run smoke:package

  language-tools:
    name: Language tool matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: stCarolas/setup-maven@v5
        with:
          maven-version: "3.9.9"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: "1.85.0"
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1.8"
      - run: npm ci
      - run: python -m pip install ruff==0.13.1
      - run: npm install --global pyright@1.1.405
      - run: npm run build
      - run: node scripts/smoke-languages.mjs
        env:
          STRICT_LANGUAGE_SMOKE: "1"
          LANGUAGE_SMOKE_PROTOCOLS: "1"

  vscode-package:
    name: VS Code package
    runs-on: ubuntu-latest
    needs: node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package:vscode
      - uses: actions/upload-artifact@v7
        with:
          name: code-inspection-vscode
          path: artifacts/*.vsix

  zed-package:
    name: Zed package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: wasm32-wasip2
      - run: cargo build --target wasm32-wasip2 --release --manifest-path extensions/zed/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: code-inspection-zed
          path: extensions/zed/target/wasm32-wasip2/release/code_inspection_zed.wasm
