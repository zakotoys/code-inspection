name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node scripts/smoke-lsp.mjs
      - run: node scripts/smoke-lsp.mjs tests/fixtures/eslint-broken packages/runtime/dist/bundles/lsp.cjs
      - run: node scripts/smoke-mcp.mjs
      - run: node scripts/smoke-mcp.mjs tests/fixtures/eslint-broken packages/runtime/dist/bundles/mcp.cjs
      - run: node scripts/smoke-lifecycle.mjs
      - run: node scripts/smoke-pressure.mjs
      - run: npm run package:core && npm run package:runtime
      - run: npm run smoke:package

  language-tools:
    name: Language tools (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [general, java, clang]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        if: matrix.group == 'general'
        with:
          python-version: "3.14"
      - uses: actions/setup-java@v6
        if: matrix.group == 'java'
        with:
          distribution: temurin
          java-version: "25"
      - uses: stCarolas/setup-maven@v5
        if: matrix.group == 'java'
        with:
          maven-version: "3.9.9"
      - uses: gradle/actions/setup-gradle@v6
        if: matrix.group == 'java'
        with:
          gradle-version: "8.10.2"
      - uses: actions/setup-go@v7
        if: matrix.group == 'general'
        with:
          go-version: "1.27.1"
      - uses: actions/cache@v6
        if: matrix.group == 'general'
        id: golangci-lint
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install golangci-lint
        if: matrix.group == 'general' && steps.golangci-lint.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Add Go tools to PATH
        if: matrix.group == 'general'
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        if: matrix.group == 'general'
        with:
          toolchain: "1.85.0"
      - name: Use runner Clang 18
        if: matrix.group == 'clang'
        run: |
          test -x /usr/lib/llvm-18/bin/clang
          test -x /usr/lib/llvm-18/bin/clang-tidy
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: python -m pip install ruff==0.13.1
        if: matrix.group == 'general'
      - run: npm install --global pyright@1.1.405
        if: matrix.group == 'general'
      - run: node scripts/smoke-languages.mjs ${{ matrix.group }}
        env:
          STRICT_LANGUAGE_SMOKE: "1"
          LANGUAGE_SMOKE_PROTOCOLS: "1"

  vscode-package:
    name: VS Code package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/package-vscode.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: code-inspection-vscode
          path: artifacts/*.vsix
          if-no-files-found: error

  zed-package:
    name: Zed package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: wasm32-wasip2
      - run: cargo build --locked --target wasm32-wasip2 --release --manifest-path extensions/zed/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: code-inspection-zed
          path: extensions/zed/target/wasm32-wasip2/release/code_inspection_zed.wasm
          if-no-files-found: error
