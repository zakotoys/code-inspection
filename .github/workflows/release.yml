name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    steps:
      - name: Check out release
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          target: wasm32-wasip2

      # Trusted publishing requires npm 11.5.1 or newer.
      - name: Update npm CLI
        run: npm install --global npm@11.7.0

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${RELEASE_TAG#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match package.json version $package_version." >&2
            exit 1
          fi

          workspace_versions="$(npm pkg get version --workspaces)"
          if ! jq -e --arg version "$package_version" 'all(.[]; . == $version)' <<<"$workspace_versions" >/dev/null; then
            echo "Every npm workspace version must match $package_version." >&2
            exit 1
          fi

          runtime_core_version="$(node -p "require('./packages/runtime/package.json').dependencies['@zakotoys/code-inspection-core']")"
          if [[ "$runtime_core_version" != "$package_version" ]]; then
            echo "Runtime must depend on core@$package_version." >&2
            exit 1
          fi

          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 --manifest-path extensions/zed/Cargo.toml | jq -r '.packages[] | select(.name == "code_inspection_zed") | .version')"
          if [[ "$cargo_version" != "$package_version" ]]; then
            echo "Zed Cargo version $cargo_version does not match $package_version." >&2
            exit 1
          fi
          grep -Fxq "version = \"$package_version\"" extensions/zed/extension.toml
          grep -Fxq "export const VERSION = \"$package_version\" as const;" packages/runtime/src/version.ts

          echo "PACKAGE_VERSION=$package_version" >>"$GITHUB_ENV"
          if [[ "$package_version" == *-* ]]; then
            echo "NPM_TAG=next" >>"$GITHUB_ENV"
          else
            echo "NPM_TAG=latest" >>"$GITHUB_ENV"
          fi

      - name: Run release checks
        run: |
          npm run check
          node scripts/smoke-lsp.mjs
          node scripts/smoke-lsp.mjs tests/fixtures/eslint-broken packages/runtime/dist/bundles/lsp.cjs
          node scripts/smoke-mcp.mjs
          node scripts/smoke-mcp.mjs tests/fixtures/eslint-broken packages/runtime/dist/bundles/mcp.cjs
          node scripts/smoke-lifecycle.mjs
          node scripts/smoke-pressure.mjs

      - name: Build release artifacts
        run: |
          npm run package
          npm run smoke:package
          cd artifacts
          sha256sum \
            "zakotoys-code-inspection-core-$PACKAGE_VERSION.tgz" \
            "zakotoys-code-inspection-runtime-$PACKAGE_VERSION.tgz" \
            "code-inspection-vscode-$PACKAGE_VERSION.vsix" \
            "code-inspection-zed-$PACKAGE_VERSION.wasm" \
            >SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: code-inspection-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/*.tgz
            artifacts/*.vsix
            artifacts/*.wasm
            artifacts/SHA256SUMS

      - name: Publish core with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "./artifacts/zakotoys-code-inspection-core-$PACKAGE_VERSION.tgz" --tag "$NPM_TAG" --provenance

      - name: Publish runtime with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "./artifacts/zakotoys-code-inspection-runtime-$PACKAGE_VERSION.tgz" --tag "$NPM_TAG" --provenance

      - name: Create GitHub Release and changelog
        uses: softprops/action-gh-release@v3.0.3
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/*.tgz
            artifacts/*.vsix
            artifacts/*.wasm
            artifacts/SHA256SUMS
